name: Auto Patch and Publish

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"

    permissions:
      contents: write
      id-token: write   # ← required by npm docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Clean old config (kills always-auth warning)
        run: rm -f .npmrc ~/.npmrc && npm config delete always-auth || true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (patch)
        run: |
          # npm outputs "v1.0.13" (with v prefix already)
          TAG=$(npm version patch --no-git-tag-version)
          VERSION="${TAG#v}"
          git add package.json package-lock.json
          # Remove stale tag from a previous failed run if it exists
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag -a "$TAG" -m "chore(release): $VERSION [skip ci]"

      - name: Publish with Trusted Publishing
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -qF "$PKG_VERSION"; then
            echo "Version $PKG_VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Push version + tags
        run: git push --follow-tags

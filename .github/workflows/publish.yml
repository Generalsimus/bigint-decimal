name: Auto Patch and Publish

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write   # ← required by npm docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Clean old config (kills always-auth warning)
        run: rm -f .npmrc ~/.npmrc && npm config delete always-auth || true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version and tag
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          # Use npm registry as source of truth so we never re-bump an already-published version
          CURRENT=$(npm view "$PKG_NAME" version 2>/dev/null || node -p "require('./package.json').version")
          NEXT=$(node -p "const [ma,mi,pa]='${CURRENT}'.split('.').map(Number); \`\${ma}.\${mi}.\${pa+1}\`")
          TAG="v${NEXT}"
          # Update package.json locally (no commit — avoids pushing to protected main)
          npm version "$NEXT" --no-git-tag-version --allow-same-version 2>/dev/null || \
          npm version "$NEXT" --no-git-tag-version
          # Remove stale tag from a previous failed run if it exists
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "chore(release): $NEXT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$NEXT" >> "$GITHUB_ENV"

      - name: Publish with Trusted Publishing
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "$VERSION"; then
            echo "Version $VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Push tag
        run: git push origin "$TAG"
